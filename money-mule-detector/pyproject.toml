[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mule-detector"
version = "0.1.0"
description = "CLI tool that detects money mule accounts in a transaction CSV"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "rich>=13.0",
    "numpy>=1.24",
    "streamlit>=1.35",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/mule_detector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
